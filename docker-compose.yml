services:
  backend:
    build: ./backend
    container_name: imip-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      JWT_SECRET: industrial-management-mvp-secret
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: imip-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy